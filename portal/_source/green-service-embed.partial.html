/* =========================================================
   LIVE PHASE STATES
   .vl-step-active  = the step the reader is looking at
   .vl-step-current = where the engagement actually is
   .vl-step-done    = phases already passed

   A step can be both active and current. Active wins the
   filled circle; current keeps its ring so it stays visible
   while the reader is elsewhere.
   ========================================================= */

  border-color: #ff9a1f !important;
  box-shadow: 0 0 0 3px rgba(255, 154, 31, 0.25) !important;

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
