<!-- SuiteDash Portal Page body. Paste into SuiteDash > Portal > Pages. Do not wrap in <html>/<body>. Do not substitute {{myOrganizationOSDItemNameSOP29355}}. -->
<style>
/* ── Theme palettes: dark (default) + light, flipped via [data-theme] on .tmp-root ── */
.tmp-root[data-theme="dark"] {
  --tmp-bg-page: #0A0A0A;
  --tmp-bg-surface: #141414;
  --tmp-bg-elevated: #1F1F1F;
  --tmp-ink-primary: #FAFAF8;
  --tmp-ink-secondary: #B8B8B0;
  --tmp-ink-muted: #7A7A72;
  --tmp-accent-orange: #F97316;
  --tmp-accent-gold: #B8956A;
  --tmp-border-hairline: #2A2A2A;
  --tmp-border-emphasized: #3A3A3A;
  --tmp-heading: #F0EAE0;
}
.tmp-root[data-theme="light"] {
  --tmp-bg-page: #FAFAF8;
  --tmp-bg-surface: #FFFFFF;
  --tmp-bg-elevated: #F5F5F0;
  --tmp-ink-primary: #1A1A1A;
  --tmp-ink-secondary: #4A4A4A;
  --tmp-ink-muted: #7A7A72;
  --tmp-accent-orange: #F97316;
  --tmp-accent-gold: #B8956A;
  --tmp-border-hairline: #E5E3DE;
  --tmp-border-emphasized: #C9C6C0;
  --tmp-heading: #1A1A1A;
}
/* Smooth theme swap; disabled under reduced-motion */
.tmp-root,
.tmp-root * { transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease; }
@media (prefers-reduced-motion: reduce) {
  .tmp-root,
  .tmp-root * { transition: none; }
}
/* Theme toggle button (top-right of hero) */
.tmp-theme-toggle {
  position: absolute;
  top: 24px;
  right: 24px;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--tmp-bg-surface);
  border: 1px solid var(--tmp-border-hairline);
  border-radius: 999px;
  color: var(--tmp-ink-primary);
  cursor: pointer;
  padding: 0;
  z-index: 10;
}
.tmp-theme-toggle:hover { border-color: var(--tmp-accent-orange); }
.tmp-theme-toggle:focus-visible { outline: 2px solid var(--tmp-accent-orange); outline-offset: 2px; }
.tmp-theme-toggle__icon { width: 20px; height: 20px; }
.tmp-root[data-theme="dark"] .tmp-theme-toggle__icon--moon { display: none; }
.tmp-root[data-theme="light"] .tmp-theme-toggle__icon--sun { display: none; }
/* Only rules that cannot be inline live here: resets, keyframes, focus + reduced-motion gating */
.tmp-root, .tmp-root * { box-sizing: border-box; }
/* Fix 3: heading color follows the theme so it stays legible on the dark bg. */
.tmp-root h1 { color: var(--tmp-heading); }
.tmp-root button { font-family: inherit; cursor: pointer; }
.tmp-root button:focus-visible { outline: 2px solid var(--tmp-accent-orange); outline-offset: 2px; }
.tmp-root a:focus-visible { outline: 2px solid var(--tmp-accent-orange); outline-offset: 2px; }
@keyframes tmpSlideIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes tmpFadeUp  { from { opacity: 0; transform: translateY(8px);  } to { opacity: 1; transform: none; } }
@keyframes tmpCallout { from { opacity: 0; } to { opacity: 1; } }
.tmp-screenshot { animation: tmpSlideIn .3s ease-out both; }
.tmp-text       { animation: tmpFadeUp .3s ease-out both; animation-delay: .06s; }
.tmp-callout    { animation: tmpCallout .25s ease-out both; }
/* Client Journey Gantt */
@keyframes tmpBarIn   { from { transform: scaleX(0); opacity: .35; } to { transform: scaleX(1); opacity: 1; } }
@keyframes tmpGlabel  { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes tmpGdia    { from { opacity: 0; transform: rotate(45deg) scale(.3); } to { opacity: 1; transform: rotate(45deg) scale(1); } }
.tmp-gbar   { transform-origin: left center; animation: tmpBarIn .35s ease-out both; }
.tmp-glabel { animation: tmpGlabel .3s ease-out both; }
.tmp-gdia   { transform: rotate(45deg); animation: tmpGdia .3s ease-out both; }
/* Fix 2: hide the dull background bar; the .tmp-glabel pills are the visual buttons. */
.tmp-gbar   { display: none; }
/* Launch slide, 3-layer overlapped mockup */
@keyframes tmpL1 { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
@keyframes tmpL2 { from { opacity: 0; transform: translate(26px, 26px) rotate(3deg); } to { opacity: 1; transform: translate(0,0) rotate(3deg); } }
@keyframes tmpL3 { 0% { opacity: 0; transform: translateY(-30px); } 70% { opacity: 1; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
.tmp-l1 { animation: tmpL1 .25s ease-out both; }
.tmp-l2 { transform: rotate(3deg); animation: tmpL2 .25s ease-out both; animation-delay: .20s; }
.tmp-l3 { animation: tmpL3 .20s ease-out .45s both, tmpPulse 2.6s ease-in-out 1.2s infinite; }
/* gentle orange glow pulse on a slide's key element */
@keyframes tmpPulse { 0%, 100% { box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 rgba(249,115,22,0); } 50% { box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 24px rgba(249,115,22,0.12); } }
.tmp-pulse { animation: tmpPulse 2.6s ease-in-out 1.2s infinite; }
/* DOMSSS / Pipeline / Portal entrances */
@keyframes tmpCardUp  { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes tmpScaleIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
.tmp-domc  { animation: tmpCardUp .3s ease-out both; }
.tmp-pnode { animation: tmpCardUp .2s ease-out both; }
.tmp-pline { transform-origin: left center; animation: tmpBarIn .8s ease-out both; }
.tmp-phub  { animation: tmpScaleIn .3s ease-out both; }
.tmp-pnode2 { animation: tmpScaleIn .3s ease-out both; }
@keyframes tmpDetail { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.tmp-detail { animation: tmpDetail .25s ease-out both; }
/* hover states (ported from the DC runtime style-hover attributes) */
.tmp-root .tmp-prev:hover { background: var(--tmp-accent-orange); color: #141414; }
.tmp-root .tmp-next:hover { background: #EA6A0C; }
.tmp-root .tmp-domc:hover { transform: translateY(-4px); border-color: var(--tmp-accent-orange); box-shadow: 0 0 22px rgba(249,115,22,0.14); }
.tmp-root .tmp-pnode-d:hover .tmp-pcircle { transform: translateY(-3px); box-shadow: 0 0 16px rgba(249,115,22,0.3); }
.tmp-root .tmp-pnode-o:hover .tmp-pcircle { transform: translateY(-3px); box-shadow: 0 0 16px rgba(184,149,106,0.3); }
.tmp-root .tmp-pnode2:hover { transform: translateY(-3px); border-color: var(--tmp-accent-orange); box-shadow: 0 0 18px rgba(249,115,22,0.14); }
@media (prefers-reduced-motion: reduce) {
  .tmp-screenshot, .tmp-text, .tmp-callout,
  .tmp-gbar, .tmp-glabel, .tmp-gdia,
  .tmp-l1, .tmp-l2, .tmp-l3, .tmp-pulse,
  .tmp-domc, .tmp-pnode, .tmp-pline, .tmp-phub, .tmp-pnode2, .tmp-detail { animation: none !important; }
}
</style>

<div class="tmp-root" data-theme="dark" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--tmp-ink-primary); background: var(--tmp-bg-page); padding: 48px 24px 88px; min-height: 100%; line-height: 1.55;">
  <div style="max-width: 1120px; margin: 0 auto;">

    <!-- ================= HERO (section 1) ================= -->
    <header style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px; padding-bottom: 40px; border-bottom: 1px solid var(--tmp-border-hairline);">
      <button class="tmp-theme-toggle" type="button" aria-label="Toggle light/dark mode" data-tmp-theme-toggle>
        <svg class="tmp-theme-toggle__icon tmp-theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="tmp-theme-toggle__icon tmp-theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <div style="max-width: 620px;">
        <!-- SmartMerge token below renders "Tax Monitor Pro" inside SuiteDash. Do not alter the token text. -->
        <span style="display: inline-block; font-family: 'SF Mono', Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--tmp-accent-orange); background: var(--tmp-bg-surface); border: 1px solid var(--tmp-border-hairline); padding: 6px 12px; border-radius: 999px;">{{myOrganizationOSDItemNameSOP29355}}</span>
        <h1 style="font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -0.01em; margin: 22px 0 14px; text-shadow: 0 2px 12px rgba(249, 115, 22, 0.15);">Model + Template Map</h1>
        <p style="font-size: 17px; color: var(--tmp-ink-secondary); margin: 0; max-width: 52ch;">Switch views to explore how the system is organized and what ships inside the template.</p>
      </div>
      <!-- Existing Lottie embed, kept verbatim. -->
      <iframe src="https://lottie.host/embed/252e6c34-249d-4514-b60e-9c3c68e0ae51/eqNl0zQiGu.lottie" title="Tax Monitor Pro animation" style="width: 260px; height: 180px; border: 0; background: transparent; flex: 0 0 auto;" loading="lazy"></iframe>
    </header>

    <!-- ================= TWO-TAB PRIMARY SWITCHER (section 2) ================= -->
    <div role="tablist" aria-label="Primary view" style="display: inline-flex; gap: 6px; background: var(--tmp-bg-surface); border: 1px solid var(--tmp-border-hairline); border-radius: 12px; padding: 5px; margin: 40px 0 26px;">
      <button type="button" role="tab" data-tmp-tab="model-tour" aria-selected="false" style="border: 1px solid transparent; background: var(--tmp-bg-surface); color: var(--tmp-ink-secondary); padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: background .18s ease, color .18s ease;">Model Tour</button>
      <button type="button" role="tab" data-tmp-tab="template-map" aria-selected="true" style="border: 1px solid var(--tmp-accent-orange); background: var(--tmp-accent-orange); color: #141414; padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: background .18s ease, color .18s ease;">Template Map</button>
    </div>

    <!-- Sub-tab strip. Click a chip, or use Left/Right arrow keys, to change step. -->
    <nav aria-label="Steps" id="tmp-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px;"></nav>

    <!-- ================= STEPPED CARD (section 3) ================= -->
    <section style="background: var(--tmp-bg-surface); border: 1px solid var(--tmp-border-hairline); border-radius: 16px; padding: 40px;">
      <!-- Card header: step indicator + prev/next -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 6px;">
        <span id="tmp-steplabel" style="font-family: 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--tmp-ink-muted); display: inline-block; padding-bottom: 4px; border-bottom: 2px solid var(--tmp-accent-orange);"></span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="tmp-prev" data-tmp-nav="prev" aria-label="Previous step" style="border: 1px solid var(--tmp-accent-orange); background: transparent; color: var(--tmp-accent-orange); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: background .18s ease, color .18s ease;">Previous</button>
          <button type="button" class="tmp-next" data-tmp-nav="next" aria-label="Next step" style="border: 1px solid var(--tmp-accent-orange); background: var(--tmp-accent-orange); color: #141414; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: background .18s ease;">Next</button>
        </div>
      </div>

      <h2 id="tmp-title" style="font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; margin: 8px 0 28px;"></h2>

      <!-- Keyed wrapper: rebuilt on step change so the screenshot slides in and the text cross-fades. -->
      <div id="tmp-keyed" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;"></div>
    </section>

  </div>
</div>

<script>
(function () {
  var ACCENT = 'var(--tmp-accent-orange)';

  // ============================================================
  // 5 MODELS (Model Tour). Captions verbatim from the CD source.
  // ============================================================
  var MODELS = [
    { name: 'Client Journey', slug: 'client-journey', caption: 'The full arc a client travels, from first contact through ongoing service.', items: [] },
    { name: 'DOMSSS', slug: 'domsss', caption: 'The operating framework the install is organized around.', items: [] },
    { name: 'Pipeline', slug: 'pipeline', caption: 'The stages a prospect passes through before becoming a client.', items: [] },
    { name: 'Portal', slug: 'portal', caption: 'What the client sees and does once they are signed in.', items: [] },
    { name: 'Launch', slug: 'launch', caption: 'How the install goes live for a firm and hands off to daily use.', items: [] }
  ];

  // ============================================================
  // 20 MODULES (Template Map). Order + copy preserved from source.
  // ============================================================
  var MODULES = [
    { name: 'Appointments', slug: 'appointments', caption: 'The booking types clients see when they schedule with the firm. Each type routes to the right calendar and confirmation sequence.', items: ['Dedicated Support', 'Onboarding Support'] },
    { name: 'Auto-Templates', slug: 'auto-templates', caption: 'Prebuilt records that clone into place when a client reaches a stage, so setup is not rebuilt by hand each time.', items: [] },
    { name: 'Business Sectors', slug: 'business-sectors', caption: 'The practice areas the firm serves, used to segment clients and tailor what each one receives.', items: [] },
    { name: 'Circles', slug: 'circles', caption: 'Groupings that control which clients see which content and pages inside the portal.', items: [] },
    { name: 'Content Categories', slug: 'content-categories', caption: 'The filing structure behind portal content, so resources land in the right place for the right audience.', items: [] },
    { name: 'Custom Fields', slug: 'custom-fields', caption: 'The extra data points TMP records on every client beyond the SuiteDash defaults. They feed auto-templates, filters, and generated documents.', items: ['Entity Type', 'Filing Status', 'Engagement Stage'] },
    { name: 'Dashes', slug: 'dashes', caption: 'The dashboards each role opens to, framing what a client or staff member sees first.', items: [] },
    { name: 'Document Generators', slug: 'document-generators', caption: 'Merge templates that build engagement letters and forms from client data on demand.', items: [] },
    { name: 'Drip Sequences', slug: 'drip-sequences', caption: 'Timed message series that carry a client through onboarding without manual sends.', items: [] },
    { name: 'Email Marketing', slug: 'email-marketing', caption: 'Broadcast campaigns to client segments for updates and seasonal reminders.', items: [] },
    { name: 'Flows', slug: 'flows', caption: 'Automations that fire on a trigger to move records, assign work, or notify the team.', items: [] },
    { name: 'Forms', slug: 'forms', caption: 'Intake and update forms that write straight into the client record.', items: [] },
    { name: 'Invoice Items', slug: 'invoice-items', caption: 'The reusable line items and service codes the firm bills against.', items: [] },
    { name: 'Landing Pages', slug: 'landing-pages', caption: 'Public pages that capture leads and route them into the pipeline.', items: [] },
    { name: 'Menus', slug: 'menus', caption: 'The navigation each portal role sees, ordered around the work they do.', items: [] },
    { name: 'Platform Branding', slug: 'platform-branding', caption: "The colors, logo, and naming that make the portal read as the firm's own.", items: [] },
    { name: 'Portal Pages', slug: 'portal-pages', caption: 'The interior pages clients reach once signed in, holding status and resources.', items: [] },
    { name: 'Projects', slug: 'projects', caption: 'The container that tracks a full engagement from kickoff to close.', items: [] },
    { name: 'Proposals', slug: 'proposals', caption: 'Scoped offers a prospect can review and accept to become a client.', items: [] },
    { name: 'Tasks', slug: 'tasks', caption: "Internal work items that move with a client through each phase. Nothing sits waiting in one person's inbox.", items: ['Intake Review', 'Return Prep', 'Signature Follow-up'] }
  ];

  // ===== DOMSSS: 6 personified pillars (verbatim from source) =====
  var DOM_PILLARS = [
    { letter: 'D', name: 'Development', subtitle: 'offers, workflows, assets', tint: '#F97316', purpose: 'Build the repeatable structures your business runs on.', description: 'Development is your creative-technical engine. It shapes your offers, builds your internal systems, and equips every other pillar to do its job.' },
    { letter: 'O', name: 'Operations', subtitle: 'process, documentation, quality', tint: '#6B8299', purpose: 'Reduce chaos and increase consistency.', description: 'Operations is your internal engine: workflows, compliance, documentation, and quality control. This is where you stop improvising and start scaling.' },
    { letter: 'M', name: 'Marketing', subtitle: 'visibility, positioning, consistency', tint: '#E8836B', purpose: 'Attract the right people with the right message.', description: 'Marketing is how the world meets your offer. Not shouting, clarity. It fuels Category 1 (Lead Development) and kicks off the motion of your pipelines.' },
    { letter: 'S', name: 'Sales', subtitle: 'calls, proposals, conversions', tint: '#C9A24B', purpose: 'Turn interest into aligned commitments.', description: 'Sales is guidance, not pressure. Discovery calls, pricing, follow-ups, commitments, the bridge between curiosity and conversion.' },
    { letter: 'S', name: 'Services', subtitle: 'delivery, fulfillment, outcomes', tint: '#7DA07D', purpose: 'Deliver predictable, high-quality results.', description: 'Services is the real product. Without defining this pillar, you end up doing everything, and resenting all of it.' },
    { letter: 'S', name: 'Support', subtitle: 'help, communication, retention', tint: '#9B8FC0', purpose: 'Strengthen trust and long-term retention.', description: "Support is relationship maintenance. How clients ask for help, how you resolve issues, and how you prevent friction. It's the quiet pillar that determines loyalty." }
  ];

  // ===== Pipeline: two 7-phase lineages (verbatim) =====
  var PIPE_DEALS = [
    { name: 'Lead Capture & Intake', desc: 'First contact is logged and routed into the system.' },
    { name: 'Qualify & Segment', desc: 'The lead is sorted by fit and grouped for the right path.' },
    { name: 'Prospect Discovery Call', desc: 'A conversation to understand needs and confirm alignment.' },
    { name: 'Offer & Close', desc: 'A scoped offer is presented and the agreement is reached.' },
    { name: 'Client Onboarding & Setup', desc: 'Access, accounts, and expectations are put in place.' },
    { name: 'Early Wins & Results', desc: 'The first deliverables land and confidence builds.' },
    { name: 'Upsell, Referral & Testimonial', desc: 'A satisfied client opens the door to more work and advocacy.' }
  ];
  var PIPE_ORDERS = [
    { name: 'General Info Capture', desc: 'The order details are gathered up front.' },
    { name: 'Project Fit & Scope Confirmation', desc: 'Scope is confirmed so both sides agree on the work.' },
    { name: 'Asset Collection & Setup', desc: 'Logins, brand assets, and inputs are collected.' },
    { name: 'Drafting & Client Review', desc: 'A first pass is built and shared for feedback.' },
    { name: 'Delivery & Fulfillment', desc: 'The finished work is handed over and put live.' },
    { name: 'Quality Review & Reporting', desc: 'Output is checked and results are documented.' },
    { name: 'Support & Exit/Offboarding', desc: 'Follow-up support is offered and the file is closed.' }
  ];

  // ===== Portal: 5 surfaces arranged radially (pentagon points) =====
  var PORT_SURFACES = [
    { name: 'Explore', type: 'compass', tint: '#5C8FA8', x: 50, y: 12, nodeDesc: 'Discover available services and offerings', long: 'Explore is the discovery surface. Clients browse what you offer and understand how each service fits their needs before they commit.' },
    { name: 'Cart', type: 'cart', tint: '#F97316', x: 88, y: 38, nodeDesc: 'Checkout, invoicing, and payment', long: 'Cart is the transaction surface. Clients check out, view invoices, and complete payment here. It keeps money movement clear and self-serve.' },
    { name: 'Order', type: 'clipboard', tint: '#7DA07D', x: 73.5, y: 80.7, nodeDesc: 'Active work, status, and deliverables', long: 'Order is the workspace surface. Active projects, current status, and deliverables live here, so a client always knows where things stand.' },
    { name: 'Support', type: 'chat', tint: '#9B8FC0', x: 26.5, y: 80.7, nodeDesc: 'Ask for help, open tickets, communicate', long: 'Support is the help surface. Clients open tickets, ask questions, and stay in contact, so nothing gets lost between conversations.' },
    { name: 'Exit', type: 'door', tint: '#8A8A82', x: 11.9, y: 38, nodeDesc: 'Offboard, submit exit survey, archive', long: 'Exit is the offboarding surface. Clients wrap up an engagement, share feedback through a short survey, and archive their records cleanly.' }
  ];

  // Inline icon SVGs, ported from the CD source icon() React.createElement calls.
  function icon(type, color) {
    var open = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    if (type === 'cart') return open + '<path d="M3 4h2l2.2 11h10l1.8-8H6.2"></path><circle cx="9" cy="20" r="1.3" fill="' + color + '" stroke="none"></circle><circle cx="18" cy="20" r="1.3" fill="' + color + '" stroke="none"></circle></svg>';
    if (type === 'compass') return open + '<circle cx="12" cy="12" r="9"></circle><path d="M12 5.5 L14 12 L12 10.5 L10 12 Z" fill="' + color + '" stroke="none"></path><path d="M12 18.5 L10 12 L12 13.5 L14 12 Z" fill="none"></path></svg>';
    if (type === 'clipboard') return open + '<rect x="5" y="4" width="14" height="17" rx="2"></rect><rect x="9" y="2.5" width="6" height="3" rx="1"></rect><path d="M8.5 10h7 M8.5 13.5h7 M8.5 17h4"></path></svg>';
    if (type === 'chat') return open + '<path d="M4 5h16v10h-9l-4 3v-3H4z"></path></svg>';
    if (type === 'door') return open + '<path d="M6 3h8v18H6"></path><path d="M11 12h8 M16 9l3 3-3 3"></path></svg>';
    return open + '</svg>';
  }

  function ganttHTML() {
    return '<div class="tmp-gantt" style="position: relative; padding: 4px 8px 12px;">'

  // Fix 4: runtime-drawn rounded elbow connectors for the Order Timeline.
  // The old static 1px connector divs don't line up once phase-button widths vary
  // with text length. Measure each pill after mount and draw a rounded elbow SVG
  // path between consecutive pills; coordinates are taken relative to the gantt
  // container via getBoundingClientRect() deltas, so the per-row position:relative
  // offsetParents (gotcha 2) never enter the math.
  function drawGanttConnectors(container) {
    var labels = Array.from(container.querySelectorAll('.tmp-glabel'));

    // Gotcha 1: entrance animations offset elements mid-transition. Freeze them so
    // getBoundingClientRect() returns final, stable coordinates.
    labels.forEach(function (l) { l.style.animation = 'none'; });
    container.querySelectorAll('.tmp-gbar').forEach(function (b) { b.style.animation = 'none'; });

    var gRect = container.getBoundingClientRect();
    var pills = labels.filter(function (l) {
      return l.classList.contains('tmp-glabel') && (l.getAttribute('style') || '').indexOf('border-radius: 6px') !== -1;
    });

    // 1. Hide the old straight 1px connector divs and the small dot markers.
    container.querySelectorAll('div').forEach(function (d) {
      if ((d.getAttribute('style') || '').indexOf('width: 1px') !== -1) d.style.display = 'none';
    });
    labels.filter(function (l) { return (l.getAttribute('style') || '').indexOf('border-radius: 50%') !== -1; })
      .forEach(function (dot) { dot.style.display = 'none'; });

    // 2. Each button's bottom/top-center relative to the container.
    var rects = pills.map(function (p) {
      var r = p.getBoundingClientRect();
      return {
        centerX: r.left - gRect.left + r.width / 2,
        top: r.top - gRect.top,
        bottom: r.top - gRect.top + r.height
      };
    });

    // 3. Rounded elbow path between each consecutive pair.
    function roundedElbow(x1, y1, x2, y2, r) {
      var ymid = (y1 + y2) / 2;
      if (Math.abs(x2 - x1) < 1) return 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2;
      var sign = x2 > x1 ? 1 : -1;
      var rr = Math.min(r, Math.abs(x2 - x1) / 2, Math.abs(ymid - y1), Math.abs(y2 - ymid));
      return 'M ' + x1 + ' ' + y1 + ' L ' + x1 + ' ' + (ymid - rr) + ' Q ' + x1 + ' ' + ymid + ' ' + (x1 + sign * rr) + ' ' + ymid + ' ' +
             'L ' + (x2 - sign * rr) + ' ' + ymid + ' Q ' + x2 + ' ' + ymid + ' ' + x2 + ' ' + (ymid + rr) + ' L ' + x2 + ' ' + y2;
    }

    // 4. Remove any prior SVG this function added, then draw fresh.
    container.querySelectorAll('svg[data-tmp-gantt-connectors]').forEach(function (el) { el.remove(); });

    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', container.clientWidth);
    svg.setAttribute('height', container.clientHeight);
    svg.setAttribute('data-tmp-gantt-connectors', 'true');
    Object.assign(svg.style, { position: 'absolute', left: '0', top: '0', zIndex: '1', pointerEvents: 'none' });

    for (var i = 0; i < rects.length - 1; i++) {
      var a = rects[i], b = rects[i + 1];
      var path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', roundedElbow(a.centerX, a.bottom, b.centerX, b.top, 8));
      path.setAttribute('fill', 'none');
      // Stroke follows the theme system; hex fallback covers non-var browsers.
      path.setAttribute('stroke', 'var(--tmp-border-emphasized, #6b6b62)');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('stroke-linecap', 'round');
      svg.appendChild(path);
    }

    container.style.position = 'relative';
    container.insertBefore(svg, container.firstChild);
  }

  function run() {
    var root = document.querySelector('.tmp-root');
    if (!root) return;
    if (root.getAttribute('data-tmp-init') === '1') return;
    root.setAttribute('data-tmp-init', '1');

    var state = { view: 'template-map', theme: 'dark', tStep: 0, mStep: 0, domSel: null, pipeOpen: null, portSel: null, portHover: null };

    try {
      var pv = new URLSearchParams(window.location.search).get('view');
      if (pv === 'model-tour' || pv === 'template-map') state.view = pv;
    } catch (e) {}

    // Initial theme: URL ?theme= wins, then prefers-color-scheme, then dark.
    try {
      var pt = new URLSearchParams(window.location.search).get('theme');
      if (pt === 'dark' || pt === 'light') state.theme = pt;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) state.theme = 'light';
    } catch (e) {}

    function isTemplate() { return state.view === 'template-map'; }
    function list() { return isTemplate() ? MODULES : MODELS; }
    function stepIndex() { return isTemplate() ? state.tStep : state.mStep; }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function q(sel) { return root.querySelector(sel); }

    var chipsEl = q('#tmp-chips');
    var stepLabelEl = q('#tmp-steplabel');
    var titleEl = q('#tmp-title');
    var keyedEl = q('#tmp-keyed');

    // Fix 4: keep the Gantt elbow connectors in sync with layout.
    function syncGanttConnectors() {
      var gantt = root.querySelector('.tmp-gantt');
      if (gantt) drawGanttConnectors(gantt);
    }
    var resizeTimer = null;
    function onResize() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(syncGanttConnectors, 150);
    }

    function shotHTML() {
      if (!isTemplate()) {
        var i = state.mStep;
        if (i === 0) return ganttHTML();
        if (i === 1) return domsssHTML(state.domSel);
        if (i === 2) return pipelineHTML(state.pipeOpen);
        if (i === 3) return portalHTML(state.portSel, state.portHover);
        if (i === 4) return launchHTML();
      }
      var item = list()[Math.min(stepIndex(), list().length - 1)];
      return moduleSvgHTML('/lentax-styles/tmp/modules/' + (item ? item.slug : '') + '.png');
    }

    function textHTML() {
      var item = list()[Math.min(stepIndex(), list().length - 1)];
      if (!item) return '';
      var out = '<p style="font-size: 16px; color: var(--tmp-ink-secondary); margin: 0 0 26px; max-width: 44ch;">' + item.caption + '</p>';
      if (item.items.length > 0) {
        var lis = '';
        for (var k = 0; k < item.items.length; k++) {
          lis += '<li style="display: flex; align-items: baseline; gap: 10px; font-size: 15px; color: var(--tmp-ink-primary);"><span style="flex: 0 0 auto; width: 5px; height: 5px; border-radius: 50%; background: var(--tmp-accent-gold); transform: translateY(-2px);"></span><span>' + item.items[k] + '</span></li>';
        }
        out += '<div><div style="font-family: \'SF Mono\', Menlo, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tmp-ink-muted); margin-bottom: 12px;">Included in this module</div><ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">' + lis + '</ul></div>';
      }
      return out;
    }

    function updateTabs() {
      var tabs = root.querySelectorAll('[data-tmp-tab]');
      for (var i = 0; i < tabs.length; i++) {
        var el = tabs[i];
        var active = el.getAttribute('data-tmp-tab') === state.view;
        el.setAttribute('aria-selected', active ? 'true' : 'false');
        el.style.border = '1px solid ' + (active ? ACCENT : 'transparent');
        el.style.background = active ? ACCENT : 'var(--tmp-bg-surface)';
        el.style.color = active ? '#141414' : 'var(--tmp-ink-secondary)';
      }
    }

    function render() {
      var isT = isTemplate();
      var l = list();
      var total = l.length;
      var i = Math.min(stepIndex(), total - 1);

      updateTabs();

      if (chipsEl) {
        var chips = '';
        for (var c = 0; c < total; c++) {
          var active = c === i;
          chips += '<button type="button" data-tmp-chip="' + c + '" aria-current="' + (active ? 'true' : 'false') + '" style="border: 1px solid ' + (active ? ACCENT : 'var(--tmp-border-hairline)') + '; background: ' + (active ? ACCENT : 'var(--tmp-bg-surface)') + '; color: ' + (active ? '#141414' : 'var(--tmp-ink-secondary)') + '; font-weight: ' + (active ? '600' : '400') + '; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; transition: background .18s ease, color .18s ease, border-color .18s ease;">' + l[c].name + '</button>';
        }
        chipsEl.innerHTML = chips;
      }

      if (stepLabelEl) stepLabelEl.textContent = (isT ? 'Module' : 'Model') + ' ' + pad(i + 1) + ' of ' + pad(total);
      if (titleEl) titleEl.textContent = l[i].name;

      if (keyedEl) {
        keyedEl.innerHTML =
          '<div class="tmp-screenshot" style="flex: 1 1 460px; min-width: 300px;">' + shotHTML() + '</div>' +
          '<div class="tmp-text" style="flex: 1 1 300px; min-width: 260px;">' + textHTML() + '</div>';
      }

      // Fix 4: the Client Journey Gantt is (re)mounted here on tab/step change;
      // redraw its elbow connectors against the fresh layout. No-ops otherwise.
      syncGanttConnectors();
    }

    function applyTheme() {
      root.setAttribute('data-theme', state.theme);
    }
    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      // Fix 4: connector geometry is layout-stable across a theme swap, but redraw
      // so the fresh stroke resolves the new --tmp-border-emphasized value.
      syncGanttConnectors();
      try {
        // Preserve the existing ?view= param; only rewrite ?theme=.
        var u = new URL(window.location.href);
        u.searchParams.set('theme', state.theme);
        window.history.replaceState({}, '', u);
      } catch (e) {}
    }

    function setView(v) {
      state.view = v;
      try {
        var u = new URL(window.location.href);
        u.searchParams.set('view', v);
        window.history.replaceState({}, '', u);
      } catch (e) {}
      render();
    }
    function goto(n) {
      if (isTemplate()) state.tStep = n; else state.mStep = n;
      render();
    }
    function next() { var len = list().length; goto((stepIndex() + 1) % len); }
    function prev() { var len = list().length; goto((stepIndex() - 1 + len) % len); }

    function domSelect(idx) {
      state.domSel = idx;
      var grid = q('#tmp-domgrid');
      var overlay = q('#tmp-domoverlay');
      if (grid) { grid.style.opacity = '0.28'; grid.style.pointerEvents = 'none'; }
      if (overlay) overlay.innerHTML = domOverlayHTML(idx);
    }
    function domClose() {
      state.domSel = null;
      var grid = q('#tmp-domgrid');
      var overlay = q('#tmp-domoverlay');
      if (grid) { grid.style.opacity = '1'; grid.style.pointerEvents = 'auto'; }
      if (overlay) overlay.innerHTML = '';
    }
    function pipeToggle(k) {
      state.pipeOpen = state.pipeOpen === k ? null : k;
      var dd = q('#tmp-dealdetail');
      var od = q('#tmp-orderdetail');
      if (dd) dd.innerHTML = dealDetailBox(state.pipeOpen);
      if (od) od.innerHTML = orderDetailBox(state.pipeOpen);
      var nodes = root.querySelectorAll('[data-tmp-pipe]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-tmp-pipe') === state.pipeOpen ? 'true' : 'false');
      }
    }
    function updateLines() {
      var lines = root.querySelectorAll('[data-tmp-line]');
      for (var i = 0; i < lines.length; i++) {
        var idx = Number(lines[i].getAttribute('data-tmp-line'));
        var on = idx === state.portSel || idx === state.portHover;
        lines[i].setAttribute('stroke', on ? '#F97316' : '#2A2A2A');
        lines[i].setAttribute('stroke-width', on ? '0.7' : '0.4');
      }
    }
    function portSelect(idx) {
      state.portSel = state.portSel === idx ? null : idx;
      var hub = q('#tmp-porthub');
      if (hub) hub.textContent = state.portSel != null ? PORT_SURFACES[state.portSel].name : 'Client Portal';
      var wraps = root.querySelectorAll('[data-tmp-pwrap]');
      for (var i = 0; i < wraps.length; i++) {
        wraps[i].style.zIndex = Number(wraps[i].getAttribute('data-tmp-pwrap')) === state.portSel ? '6' : '3';
      }
      var btns = root.querySelectorAll('[data-tmp-port]');
      for (var j = 0; j < btns.length; j++) {
        btns[j].setAttribute('aria-pressed', Number(btns[j].getAttribute('data-tmp-port')) === state.portSel ? 'true' : 'false');
      }
      var slots = root.querySelectorAll('[data-tmp-pdetail]');
      for (var m = 0; m < slots.length; m++) {
        var si = Number(slots[m].getAttribute('data-tmp-pdetail'));
        slots[m].innerHTML = si === state.portSel ? '<div class="tmp-detail" style="font-size: 11px; color: var(--tmp-ink-secondary); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--tmp-border-hairline); text-align: left;">' + PORT_SURFACES[si].long + '</div>' : '';
      }
      updateLines();
    }

    function onClick(e) {
      var t = e.target;
      var themeBtn = t.closest('[data-tmp-theme-toggle]');
      if (themeBtn && root.contains(themeBtn)) { toggleTheme(); return; }
      var tab = t.closest('[data-tmp-tab]');
      if (tab && root.contains(tab)) { var v = tab.getAttribute('data-tmp-tab'); if (v === 'template-map' || v === 'model-tour') setView(v); return; }
      var chip = t.closest('[data-tmp-chip]');
      if (chip && root.contains(chip)) { goto(Number(chip.getAttribute('data-tmp-chip'))); return; }
      var nav = t.closest('[data-tmp-nav]');
      if (nav && root.contains(nav)) { if (nav.getAttribute('data-tmp-nav') === 'next') next(); else prev(); return; }
      var domCloseEl = t.closest('[data-tmp-domclose]');
      if (domCloseEl && root.contains(domCloseEl)) { domClose(); return; }
      var domCard = t.closest('[data-tmp-dom]');
      if (domCard && root.contains(domCard)) { domSelect(Number(domCard.getAttribute('data-tmp-dom'))); return; }
      var pipe = t.closest('[data-tmp-pipe]');
      if (pipe && root.contains(pipe)) { pipeToggle(pipe.getAttribute('data-tmp-pipe') || ''); return; }
      var port = t.closest('[data-tmp-port]');
      if (port && root.contains(port)) { portSelect(Number(port.getAttribute('data-tmp-port'))); return; }
    }
    function onOver(e) {
      var port = e.target.closest('[data-tmp-port]');
      if (port && root.contains(port)) { state.portHover = Number(port.getAttribute('data-tmp-port')); updateLines(); }
    }
    function onOut(e) {
      var port = e.target.closest('[data-tmp-port]');
      if (port && root.contains(port)) { state.portHover = null; updateLines(); }
    }
    function onKey(e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
      else if (e.key === 'Escape') { state.domSel = null; state.portSel = null; state.pipeOpen = null; render(); }
    }

    root.addEventListener('click', onClick);
    root.addEventListener('mouseover', onOver);
    root.addEventListener('mouseout', onOut);
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', onResize);

    applyTheme();
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
